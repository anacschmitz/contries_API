services:
  postgres:
    image: postgres:16-alpine
    container_name: contries-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: countriescities
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: contries-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: countriescities
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8081:8081"

volumes:
  postgres-data: